name: Dream Viewer CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Client)
        run: |
          cd client
          npm ci

      - name: Typecheck & Build Client
        run: |
          cd client
          npm run build

      - name: Install dependencies (Server)
        run: |
          cd server
          npm ci

      - name: Typecheck & Build Server
        run: |
          cd server
          npm run build

      - name: Run Backend Integration & Moderation Verification Tests
        env:
          DREAM_PROVIDER: mock
          PORT: 5000
          HOST: 127.0.0.1
        run: |
          cd server
          node dist/index.js &
          sleep 3
          cd ..
          node test_api.mjs
